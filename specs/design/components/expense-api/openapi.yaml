openapi: 3.0.3
info:
  title: Expense API
  version: 0.1.0
  description: Household expense tracking — expenses, categories, limits, and totals.
servers:
  - url: /
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: X-User-Id
      in: header
      required: true
      description: caller identity injected by the gateway from the validated token
      schema: { type: string }
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema: { type: string }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    Category:
      type: object
      required: [id, name, limitAmount]
      properties:
        id: { type: string }
        name: { type: string }
        limitAmount: { type: number, format: double, description: spending limit for this category }
        createdBy: { type: string, description: household member id who created it }
    CategoryInput:
      type: object
      required: [name, limitAmount]
      properties:
        name: { type: string }
        limitAmount: { type: number, format: double }
    CategoryStatus:
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          properties:
            spent: { type: number, format: double, description: total spent this month against the limit }
            status: { type: string, enum: [ok, approaching, exceeded] }
    Expense:
      type: object
      required: [id, amount, currency, homeCurrencyAmount, expenseDate, categoryId, loggedBy]
      properties:
        id: { type: string }
        amount: { type: number, format: double, description: amount as paid, in `currency` }
        currency: { type: string, description: ISO 4217 code the expense was paid in, e.g. USD, EUR }
        homeCurrencyAmount: { type: number, format: double, description: amount converted to the household's home currency (USD) }
        exchangeRate: { type: number, format: double, nullable: true, description: rate used for conversion; null when currency is already USD }
        expenseDate: { type: string, format: date }
        note: { type: string }
        categoryId: { type: string }
        loggedBy: { type: string, description: household member id who logged it }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ExpenseInput:
      type: object
      required: [amount, expenseDate, categoryId]
      properties:
        amount: { type: number, format: double }
        currency: { type: string, default: USD, description: ISO 4217 code the expense was paid in; defaults to the household's home currency }
        expenseDate: { type: string, format: date }
        note: { type: string }
        categoryId: { type: string }
    TotalsSummary:
      type: object
      required: [period, total]
      properties:
        period: { type: string, enum: [daily, weekly, monthly] }
        total: { type: number, format: double }
        byCategory:
          type: array
          items:
            type: object
            properties:
              categoryId: { type: string }
              categoryName: { type: string }
              total: { type: number, format: double }
paths:
  /expenses:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listExpenses
      summary: List household expenses
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: categoryId
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: page of expenses
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Expense' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createExpense
      summary: Log a new expense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '201':
          description: expense created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400':
          description: invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /expenses/{expenseId}:
    parameters:
      - $ref: '#/components/parameters/ExpenseId'
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getExpense
      summary: Get a single expense
      responses:
        '200':
          description: the expense
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '404':
          description: expense not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: updateExpense
      summary: Edit an expense (any household member)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '200':
          description: expense updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400':
          description: invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: expense not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteExpense
      summary: Delete an expense (any household member)
      responses:
        '204':
          description: expense deleted
        '404':
          description: expense not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /categories:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listCategories
      summary: List categories with current spend status
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: page of categories with status
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CategoryStatus' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createCategory
      summary: Create a category and its limit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: category created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400':
          description: invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: updateCategory
      summary: Edit a category name or limit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200':
          description: category updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '404':
          description: category not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteCategory
      summary: Delete a category
      responses:
        '204':
          description: category deleted
        '404':
          description: category not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /totals:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getTotals
      summary: Get spending totals for a period, overall and per category
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, enum: [daily, weekly, monthly] }
      responses:
        '200':
          description: totals for the requested period
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotalsSummary' }
        '400':
          description: invalid period
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
